    q: What is the 2026 EPR fee per pound for PET bottles in Texas?
    states: [TX]
    expect: {gap: true}
  - id: T2
    q: What was Amcor's 2026 revenue from compostable packaging?
    expect: {gap: true}
  - id: T3
    q: What are Japan's packaging extended producer responsibility fee rates?
    expect: {gap: true}
  - id: T4
    q: What will California's SB 54 producer fee per pound for paper packaging be in 2030?
    states: [CA]
    expect: {gap: true}
  - id: T5
    q: What does a 10 x 13 inch paper mailer cost from Uline?
    expect: {gap: true}

cost:
  - id: K1
    profile: ecommerce_mailer
    note: poly mailer vs paper mailer, 7 EPR states
  - id: K2
    profile: cosmetics_bottle
    note: PET bottle vs rPET / glass / aluminum / refill, nationwide
  - id: K3
    profile: snack_pouch
    note: multilayer pouch vs mono-material film / coated paper
  - id: K4
    profile_inline: {package_type: rigid bottle, current_material: PET, unit_weight_g: 28, sales_states: [OR], candidate_alternatives: [glass]}
    note: OR fee on a 28 g PET bottle = 0.028 kg x 12 cents/lb x 2.2046 = $0.0074
  - id: K5
    profile_inline: {package_type: corrugated box, current_material: corrugated, dimensions: {l_cm: 30, w_cm: 20, h_cm: 15}, sales_states: [CO], candidate_alternatives: [molded_fiber]}
    note: no unit weight or thickness; current weight must be reported as a gap, not invented
  - id: K6
    profile_inline: {package_type: mailer, current_material: LDPE/LLDPE, unit_weight_g: 25, dimensions: {l_cm: 33, w_cm: 25}, sales_states: [OR, CA], annual_units: 500000, candidate_alternatives: [paper_kraft]}
    note: OR fee applies, CA enacted but no fees yet

