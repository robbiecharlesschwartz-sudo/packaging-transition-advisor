name: eval
# On-demand 45-question evaluation against the deployed worker. Commits the results.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated question ids (blank = all 45)'
        default: ''

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      EVAL_URL: ${{ secrets.WORKER_URL || 'https://packaging-transition-advisor.pta-worker.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Run evaluation
        run: python eval/run_eval.py --url "$EVAL_URL" --only "${{ inputs.only }}" --sleep 4
      - name: Commit results
        run: |
          git config user.name "eval-bot"
          git config user.email "actions@users.noreply.github.com"
          git add eval/results docs/EVALUATION.md
          git diff --cached --quiet || git commit -m "Evaluation run $(date -u +%F)"
          git push
